<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowchart Sistem Usulan - Ibrahim Aqiqah</title>
<style>
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #fff;
        margin: 0;
        padding: 30px 20px 50px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .header {
        text-align: center;
        margin-bottom: 20px;
    }
    .header h1 {
        font-size: 22px;
        margin: 0 0 4px;
        color: #1a1a1a;
    }
    .header p {
        font-size: 14px;
        color: #555;
        margin: 0;
    }
    .figure-caption {
        text-align: center;
        font-style: italic;
        font-size: 13px;
        color: #333;
        margin-top: 15px;
    }
    svg {
        max-width: 100%;
        height: auto;
    }
    @media print {
        body { padding: 0; }
        .header { margin-bottom: 10px; }
    }
</style>
</head>
<body>

<div class="header">
    <h1>Flowchart Sistem Usulan</h1>
    <p>Sistem Informasi Pemesanan dan Penjadwalan Pemotongan Hewan Aqiqah dengan Algoritma EDF</p>
</div>

<svg viewBox="0 0 800 1200" width="800" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
        </marker>
    </defs>

    <!-- ===== KONEKTOR (GARIS + PANAH) ===== -->
    <!-- 1 -> 2 -->
    <line x1="400" y1="55" x2="400" y2="92" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- 2 -> 3 -->
    <line x1="400" y1="162" x2="400" y2="202" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- 3 -> 4 -->
    <line x1="400" y1="272" x2="400" y2="312" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- 4 -> 5 -->
    <line x1="400" y1="382" x2="400" y2="422" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- 5 -> 6 -->
    <line x1="400" y1="497" x2="400" y2="547" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Decision 6: Ya -> loop kembali ke proses 5 (EDF) -->
    <path d="M 290 590 L 210 590 L 210 472 L 252 472" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="215" y="575" font-size="14" font-weight="bold" fill="#c0392b" font-family="Arial">Ya</text>

    <!-- Decision 6: Tidak -> 7 -->
    <line x1="400" y1="635" x2="400" y2="672" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="412" y="660" font-size="14" font-weight="bold" fill="#1e8449" font-family="Arial">Tidak</text>

    <!-- 7 -> 8 -->
    <line x1="400" y1="742" x2="400" y2="792" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- 8 -> 9 -->
    <line x1="400" y1="862" x2="400" y2="912" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- 9 -> 10 -->
    <line x1="400" y1="982" x2="400" y2="1032" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- 10 -> 11 -->
    <line x1="400" y1="1102" x2="400" y2="1140" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- ===== NODE 1: MULAI ===== -->
    <ellipse cx="400" cy="30" rx="80" ry="25" fill="#cce5ff" stroke="#333" stroke-width="2"/>
    <text x="400" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#000" font-family="Arial">Mulai</text>

    <!-- ===== NODE 2: LOGIN ===== -->
    <rect x="240" y="92" width="320" height="70" rx="8" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
    <text x="400" y="116" text-anchor="middle" font-size="14" fill="#000" font-family="Arial">Admin login ke sistem</text>
    <text x="400" y="140" text-anchor="middle" font-size="13" fill="#333" font-family="Arial">(validasi username & password, session)</text>

    <!-- ===== NODE 3: INPUT DATA PESANAN ===== -->
    <rect x="210" y="202" width="380" height="70" rx="8" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
    <text x="400" y="225" text-anchor="middle" font-size="14" fill="#000" font-family="Arial">Admin input data pesanan:</text>
    <text x="400" y="245" text-anchor="middle" font-size="14" fill="#000" font-family="Arial">pelanggan, paket aqiqah, jumlah hewan,</text>
    <text x="400" y="265" text-anchor="middle" font-size="14" fill="#000" font-family="Arial">& tanggal pelaksanaan (deadline)</text>

    <!-- ===== NODE 4: SIMPAN DATABASE ===== -->
    <rect x="250" y="312" width="300" height="70" rx="8" fill="#e8f8f5" stroke="#333" stroke-width="2"/>
    <text x="400" y="336" text-anchor="middle" font-size="14" fill="#000" font-family="Arial">Sistem menyimpan data</text>
    <text x="400" y="356" text-anchor="middle" font-size="14" fill="#000" font-family="Arial">ke dalam database</text>
    <text x="400" y="376" text-anchor="middle" font-size="13" fill="#333" font-family="Arial">(tabel customers, orders, dll)</text>

    <!-- ===== NODE 5: PROSES EDF ===== -->
    <rect x="210" y="422" width="380" height="75" rx="8" fill="#fff3cd" stroke="#333" stroke-width="2"/>
    <text x="400" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#000" font-family="Arial">Sistem menjalankan algoritma EDF</text>
    <text x="400" y="466" text-anchor="middle" font-size="14" fill="#000" font-family="Arial">(Earliest Deadline First):</text>
    <text x="400" y="486" text-anchor="middle" font-size="13" fill="#333" font-family="Arial">mengurutkan pesanan berdasarkan deadline terdekat</text>

    <!-- ===== NODE 6: DECISION (BELAH KETUPAT) ===== -->
    <polygon points="400,547 510,590 400,633 290,590" fill="#fff3cd" stroke="#333" stroke-width="2"/>
    <text x="400" y="584" text-anchor="middle" font-size="13" fill="#000" font-family="Arial">Masih ada pesanan</text>
    <text x="400" y="601" text-anchor="middle" font-size="13" fill="#000" font-family="Arial">belum dijadwalkan?</text>

    <!-- ===== NODE 7: TAMPIL JADWAL ===== -->
    <rect x="215" y="672" width="370" height="70" rx="8" fill="#e8f8f5" stroke="#333" stroke-width="2"/>
    <text x="400" y="696" text-anchor="middle" font-size="14" fill="#000" font-family="Arial">Sistem menampilkan jadwal pemotongan</text>
    <text x="400" y="716" text-anchor="middle" font-size="14" fill="#000" font-family="Arial">terurut otomatis</text>
    <text x="400" y="734" text-anchor="middle" font-size="13" fill="#333" font-family="Arial">(halaman Dashboard & Kalender)</text>

    <!-- ===== NODE 8: NOTIFIKASI ===== -->
    <rect x="195" y="792" width="410" height="70" rx="8" fill="#eaf2f8" stroke="#333" stroke-width="2"/>
    <text x="400" y="816" text-anchor="middle" font-size="14" fill="#000" font-family="Arial">Sistem mengirim notifikasi otomatis</text>
    <text x="400" y="836" text-anchor="middle" font-size="14" fill="#000" font-family="Arial">jadwal & status pesanan kepada pelanggan</text>
    <text x="400" y="856" text-anchor="middle" font-size="13" fill="#333" font-family="Arial">(Telegram Bot / WhatsApp, recap harian H-1, H+1)</text>

    <!-- ===== NODE 9: UPDATE STATUS ===== -->
    <rect x="215" y="912" width="370" height="70" rx="8" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
    <text x="400" y="936" text-anchor="middle" font-size="14" fill="#000" font-family="Arial">Admin mengelola status pesanan:</text>
    <text x="400" y="956" text-anchor="middle" font-size="14" fill="#000" font-family="Arial">Pending, Terjadwal, Diproses, Selesai</text>
    <text x="400" y="976" text-anchor="middle" font-size="13" fill="#333" font-family="Arial">(diperbarui pada halaman Pemesanan)</text>

    <!-- ===== NODE 10: LAPORAN & SERTIFIKAT ===== -->
    <rect x="195" y="1032" width="410" height="70" rx="8" fill="#fdf2e9" stroke="#333" stroke-width="2"/>
    <text x="400" y="1056" text-anchor="middle" font-size="14" fill="#000" font-family="Arial">Sistem menghasilkan laporan</text>
    <text x="400" y="1076" text-anchor="middle" font-size="14" fill="#000" font-family="Arial">& sertifikat aqiqah</text>
    <text x="400" y="1096" text-anchor="middle" font-size="13" fill="#333" font-family="Arial">(laporan pemesanan, detail, tabel pemotongan)</text>

    <!-- ===== NODE 11: SELESAI ===== -->
    <ellipse cx="400" cy="1165" rx="80" ry="25" fill="#d4edda" stroke="#333" stroke-width="2"/>
    <text x="400" y="1170" text-anchor="middle" font-size="16" font-weight="bold" fill="#000" font-family="Arial">Selesai</text>
</svg>

<div class="figure-caption">
    Gambar 3.X Flowchart Sistem Usulan Pemesanan dan Penjadwalan Aqiqah dengan Algoritma EDF
</div>

</body>
</html>
